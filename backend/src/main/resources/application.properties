spring.application.name=FitGear

# H2 database configuration for the first product-learning phase
spring.datasource.url=jdbc:h2:mem:fitgear;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console for database inspection during development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

fitgear.jwt.secret=${JWT_SECRET:ZmVpdGdlYXItZGV2LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0zMi1ieXRlcy1sb25n}
fitgear.jwt.expiration=${JWT_EXPIRATION:PT1H}
