spring.application.name=FitGear

# ---------------------------------------------------------------------------
# Dev database: in-memory H2 running in MySQL compatibility mode so the same
# Flyway SQL works locally and against real MySQL (see application-mysql.properties)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:fitgear;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Flyway (src/main/resources/db/migration).
# Hibernate only validates that entities match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------------------
# Security - REQUIRED environment variables (no secrets in source control)
# JWT_SECRET must be at least 32 characters long.
# ---------------------------------------------------------------------------
fitgear.jwt.secret=${JWT_SECRET}
fitgear.jwt.expiration=${JWT_EXPIRATION:PT12H}
fitgear.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Admin account provisioning (public registration always creates CUSTOMER)
fitgear.admin.email=${ADMIN_EMAIL:}
fitgear.admin.password=${ADMIN_PASSWORD:}

# Razorpay test-mode credentials (leave empty to offer COD only)
fitgear.razorpay.key-id=${RAZORPAY_KEY_ID:}
fitgear.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
fitgear.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Seed demo products on an empty database
fitgear.seed.enabled=${SEED_PRODUCTS:true}

# Actuator: health endpoint only (used by Docker healthchecks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
