spring.config.activate.on-profile=mysql

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/fitgear?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Bounded connection pool: keeps us well inside the per-plan max_connections
# of a managed MySQL service (Aiven). Override with DB_POOL_MAX_SIZE if needed.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000

# Render injects PORT (default 10000); local/Docker runs keep 8080.
server.port=${PORT:8080}
# Honor X-Forwarded-Proto/Host from the platform's TLS-terminating proxy.
server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false
